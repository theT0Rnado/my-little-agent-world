server:
  port: 8082

spring:
  application:
    name: world-service

  datasource:
    url: jdbc:postgresql://localhost:5432/world_db
    username: program
    password: yellow-granny-troll-boom
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

# ← ТОЛЬКО ЭТОТ БЛОК, дубликат внутри spring: убрать!
rabbitmq:
  exchange:
    news: news.exchange
  queue:
    news-from-ai: news.from.ai.queue
    conversation: conversation.queue
  routing-key:
    news-from-ai: news.from.ai
    conversation: conversation.save

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.thet0rnado.mylittleagentworld: DEBUG
    org.springframework.amqp: INFO
    org.hibernate.SQL: DEBUG