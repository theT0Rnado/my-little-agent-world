spring:
  application:
    name: agent-service

  datasource:
    url: jdbc:postgresql://localhost:5432/agent_db
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

    rabbitmq:
      host: localhost
      port: 5672
      username: guest
      password: guest
      listener:
        simple:
          acknowledge-mode: auto
          retry:
            enabled: true
            initial-interval: 1000
            max-attempts: 3
            multiplier: 2.0

rabbitmq:
  exchange:
    requests: requests.exchange
  queue:
    requests-to-ai: requests.to.ai.queue
  routing-key:
    requests-to-ai: requests.to.ai

server:
  port: 8081

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka

logging:
  level:
    org.springframework.amqp: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
